<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h1>BUSCAR CEP</h1>
            <label for="cep">Digite um CEP: </label><br>
            <input type="text" id="cep" placeholder="Não utilizar n° de casa/apto/lote/predio ou abreviações"
                required><br>
            <button onclick="consultarCep()">Buscar</button>
    </main>
    <table>
        <tr>
            <th> Logradouro/Nome</th>
            <th> Bairro/Distrito</th>
            <th> Localidade/UF</th>
            <th> CEP</th>
        </tr>
        <tr>
            <td id="logadouro"></td>
            <td id="bairro"></td>
            <td id="localidade"></td>
            <td id="ceep"></td>
        </tr>
    </table>
    <script>
        let cepNumero;
        function consultarCep() {
            let cep = document.getElementById("cep").value;
            cepNumero = parseInt(cep);
            fetch(https://viacep.com.br/ws/${cepNumero}/json/)
                .then(response => {
                    return response.json()
                }))
                .then(dados => {
                    document.getElementById("logadouro").innerText = (dados.logradouro)
                    document.getElementById("bairro").innerText = (dados.bairro)
                    document.getElementById("localidade").innerText = (dados.localidade)
                    document.getElementById("ceep").innerText = (dados.cep)
                })
                .catch(erro => {

                })
        }

    </script>
</body>

</html>
